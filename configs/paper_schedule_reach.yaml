# The PINN on Zhang et al.'s schedule with a learning rate of its own, 1e-3, for mu_D and mu_rho, so that
# they can move as far as the CMA-ES estimates (our change; experiments/pinn_param_lr.py).
# Same as configs/paper_schedule.yaml except the keys marked below; base.yaml explains every setting.

model:
  factor: 10.0
  voxel_mm: 1.0
  t_final: 1.0
  n_save: 2
  cfl_safety: 0.99
  phase_field:
    n_iter: 100
    epsilon_mm: 3.0

initial_condition:
  h_init: 0.5
  r_init: 0.01

characteristic:
  radius_method: rvol
  xdim: 3
  domain_mm: 180.0
  d_grid: [0.1, 1.0, 10]
  rho_grid: [0.01, 0.1, 10]

parameters:
  mu_d:   {init: 1.0, min: 0.0, max: 2.0}
  mu_rho: {init: 1.0, min: 0.0, max: 2.0}
  th_wt:  {init: 0.35, min: 0.0, max: 1.0}
  th_tc:  {init: 0.70, min: 0.0, max: 1.0}

objective:
  steepness: 20.0
  weights:
    seg_wt: 1.0e-5
    seg_tc: 1.0e-5
    reg_mu_d: 1.0e-3
    reg_mu_rho: 1.0e-3
    reg_th_wt: 1.0e-3
    reg_th_tc: 1.0e-3
    range_penalty: 1.0

cmaes:
  sigma0: 0.25
  popsize: 8
  max_evaluations: 600
  tol_fun: 1.0e-12
  seed: 0

pinn:
  separable: false
  depth: 4
  width: 128
  arch: mmlp
  fourier: true
  sigma: 1.0
  output_rank: 64
  act: tanh
  iter_init: 20000
  iter_inv: 5000
  lr_init: 1.0e-3
  lr_inv: 1.0e-4
  early_stopping:
    patience: 1000
    min_delta: 1.0e-6
    burnin: 1000
    check_every: 10
    min_mu_d: 0.05
  param_lr:               # new, our change: in the release mu_D and mu_rho share the network's Adam group (Trainer.py:34)
    params: [rD, rRHO]    # rD, rRHO are mu_D, mu_rho; the thresholds and the network keep lr_inv
    lr: 1.0e-3            # Adam moves a parameter by at most about lr per step: 1e-3 x 5000 steps = 5, against 0.5 at lr_inv 1e-4
    stages: [inv]         # fine-tuning only; mu_D and mu_rho are frozen in pre-training
  dat_batch_size: 100000
  res_batch_size: 200000
  optimiser: Adam

  reference:
    amsgrad: true
    texp_weight: 10.0
    weights_init:
      res: 1.0
      uchar_res: 10.0
    weights_inv_res: 1.0
    m_times: 100
    Nt: 101
    scheduler: ExponentialLR
    scheduler_gamma: 1.0
    force_bc: true
    reset_optim: true
    acc_iter: 1
    rpow_weight: 0.0
    causal_weight: false
    use_fdm: false
    ksigmoid_is_dead: 50

evaluation:
  ctv_margin_mm: 15.0
  recurrence_targets: [enhancing, core]

data:
  root: src/data/predict_gbm/predict_gbm
  cohort: RHUH
  case_list: experiments/cases_rhuh.txt
  order: patient_id
  minimum_cases: 20
  maximum_cases: 40
  cache_dir: outputs/cache

synthetic:
  n_cases: 8
  fine_voxel_mm: 0.5
  noise_sigma: 0.05
  noise_smoothing_mm: 3.0
  seed: 20260916

runtime:
  device: cuda
  dtype: float32
  gpu_model: a100
  seed: 0
